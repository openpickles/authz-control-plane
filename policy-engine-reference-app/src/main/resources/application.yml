server:
  port: 9090 # Driver runs on 9090 to avoid conflict with backend 8080

logging:
  level:
    org.openpickles: DEBUG

policy-engine:
  server:
    url: http://localhost:8080
  client:
    service-name: reference-app-finance
    manifest-path: classpath:policy-manifest.yaml
    sync-enabled: true
    pull-enabled: true
    pull-interval-seconds: 60
